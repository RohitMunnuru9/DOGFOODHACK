services:
  portal:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${DOGFOOD_PORT:-8000}:3000"
    environment:
      DOGFOOD_API_ORIGIN: http://api:8000
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      HOST: 0.0.0.0
      PORT: "8000"
      DOGFOOD_DB: /data/dogfood.sqlite3
      DOGFOOD_DEMO_MODE: "${DOGFOOD_DEMO_MODE:-1}"
      DOGFOOD_ADMIN_EMAIL: "${DOGFOOD_ADMIN_EMAIL:-}"
      DOGFOOD_ADMIN_PASSWORD: "${DOGFOOD_ADMIN_PASSWORD:-}"
    volumes:
      - portal_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 8
volumes:
  portal_data:
